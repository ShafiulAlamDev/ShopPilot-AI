# =============================================================================
# Nginx configuration — ShopPilot AI
# =============================================================================
# Serves:
#   /api/*   → PHP-FPM (Laravel 10)
#   /*       → Next.js frontend (port 3000)
# =============================================================================

# Laravel API upstream
upstream php_fpm {
    server php:9000;
    keepalive 32;
}

# Next.js upstream
upstream nextjs {
    server frontend:3000;
    keepalive 32;
}

# ---------------------------------------------------------------------------
# Main server block
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name localhost;

    charset utf-8;
    client_max_body_size 50M;

    # Security headers
    add_header X-Frame-Options           "SAMEORIGIN"   always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header X-Content-Type-Options    "nosniff"      always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # ---------------------------------------------------------------------------
    # Laravel API — /api and /sanctum routes
    # ---------------------------------------------------------------------------
    location ~ ^/(api|sanctum) {
        root   /var/www/api/public;
        index  index.php;

        try_files $uri $uri/ /index.php?$query_string;

        location ~ \.php$ {
            fastcgi_pass           php_fpm;
            fastcgi_index          index.php;
            fastcgi_param          SCRIPT_FILENAME /var/www/api/public$fastcgi_script_name;
            include                fastcgi_params;
            fastcgi_read_timeout   300;
            fastcgi_buffer_size    16k;
            fastcgi_buffers        4 16k;
        }
    }

    # Static assets from Laravel public folder (images, etc.)
    location ~ ^/(storage|assets|favicon\.ico|robots\.txt) {
        root /var/www/api/public;
        try_files $uri $uri/ =404;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---------------------------------------------------------------------------
    # Next.js Frontend — everything else
    # ---------------------------------------------------------------------------
    location / {
        proxy_pass         http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_buffering    off;
    }

    # Next.js HMR websocket (dev only)
    location /_next/webpack-hmr {
        proxy_pass         http://nextjs/_next/webpack-hmr;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
    }

    # Gzip compression
    gzip            on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied    any;
    gzip_types
        application/javascript
        application/json
        application/xml
        text/css
        text/plain;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
}
