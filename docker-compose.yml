# =============================================================================
# ShopPilot AI — Docker Compose
# =============================================================================
#
# Services:
#   nginx       — Reverse proxy (port 80 → Laravel API, port 3000 → Next.js)
#   php         — PHP 8.2 FPM (Laravel 10 application)
#   mysql       — MySQL 8 database
#   redis       — Redis 7 (cache + queues + sessions)
#   frontend    — Next.js 14 development server
#   mailpit     — Local SMTP + web UI for email testing
#
# Usage:
#   docker compose up -d          # Start all services
#   docker compose up -d php      # Start only backend
#   docker compose logs -f php    # Stream logs
#   docker compose exec php bash  # Shell into PHP container
#
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Nginx — Reverse proxy
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: shoppilot_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./api:/var/www/api:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - php
      - frontend
    networks:
      - shoppilot

  # ---------------------------------------------------------------------------
  # PHP 8.2 FPM — Laravel 10 API
  # ---------------------------------------------------------------------------
  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: shoppilot_php
    restart: unless-stopped
    working_dir: /var/www/api
    volumes:
      - ./api:/var/www/api
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
      - php_storage:/var/www/api/storage/logs
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_DEBUG=${APP_DEBUG:-true}
      - DB_HOST=mysql
      - DB_DATABASE=${DB_DATABASE:-shoppilot_ai}
      - DB_USERNAME=${DB_USERNAME:-shoppilot}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - REDIS_HOST=redis
      - CACHE_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - SESSION_DRIVER=redis
      - MAIL_MAILER=smtp
      - MAIL_HOST=mailpit
      - MAIL_PORT=1025
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - shoppilot

  # ---------------------------------------------------------------------------
  # MySQL 8 — Primary database
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: shoppilot_mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-shoppilot_ai}
      MYSQL_USER: ${DB_USERNAME:-shoppilot}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - shoppilot

  # ---------------------------------------------------------------------------
  # Redis 7 — Cache, Queues, Sessions
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: shoppilot_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD:-}"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shoppilot

  # ---------------------------------------------------------------------------
  # Queue Worker — Laravel Horizon / queue:work
  # ---------------------------------------------------------------------------
  queue:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: shoppilot_queue
    restart: unless-stopped
    working_dir: /var/www/api
    command: ["php", "artisan", "queue:work", "redis", "--sleep=3", "--tries=3", "--max-time=3600"]
    volumes:
      - ./api:/var/www/api
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    environment:
      - APP_ENV=${APP_ENV:-local}
      - DB_HOST=mysql
      - DB_DATABASE=${DB_DATABASE:-shoppilot_ai}
      - DB_USERNAME=${DB_USERNAME:-shoppilot}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - REDIS_HOST=redis
      - QUEUE_CONNECTION=redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - shoppilot

  # ---------------------------------------------------------------------------
  # Scheduler — Laravel Scheduler (runs every minute)
  # ---------------------------------------------------------------------------
  scheduler:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: shoppilot_scheduler
    restart: unless-stopped
    working_dir: /var/www/api
    command: >
      sh -c "while true; do php artisan schedule:run --verbose --no-interaction & sleep 60; done"
    volumes:
      - ./api:/var/www/api
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    environment:
      - APP_ENV=${APP_ENV:-local}
      - DB_HOST=mysql
      - DB_DATABASE=${DB_DATABASE:-shoppilot_ai}
      - DB_USERNAME=${DB_USERNAME:-shoppilot}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - REDIS_HOST=redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - shoppilot

  # ---------------------------------------------------------------------------
  # Next.js 14 Frontend
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: shoppilot_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost/api}
      - NEXT_TELEMETRY_DISABLED=1
    networks:
      - shoppilot

  # ---------------------------------------------------------------------------
  # Mailpit — Local email testing (SMTP + Web UI)
  # ---------------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    container_name: shoppilot_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    environment:
      MP_MAX_MESSAGES: 500
      MP_DATA_FILE: /data/mailpit.db
    volumes:
      - mailpit_data:/data
    networks:
      - shoppilot

  # ---------------------------------------------------------------------------
  # phpMyAdmin — Optional DB GUI
  # ---------------------------------------------------------------------------
  phpmyadmin:
    image: phpmyadmin:5-apache
    container_name: shoppilot_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: ${DB_USERNAME:-shoppilot}
      PMA_PASSWORD: ${DB_PASSWORD:-secret}
    depends_on:
      - mysql
    profiles:
      - tools
    networks:
      - shoppilot

  # ---------------------------------------------------------------------------
  # Redis Commander — Optional Redis GUI
  # ---------------------------------------------------------------------------
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: shoppilot_redis_commander
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379
    depends_on:
      - redis
    profiles:
      - tools
    networks:
      - shoppilot

# =============================================================================
# Networks
# =============================================================================
networks:
  shoppilot:
    driver: bridge

# =============================================================================
# Volumes
# =============================================================================
volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  php_storage:
    driver: local
  nginx_logs:
    driver: local
  mailpit_data:
    driver: local
  frontend_node_modules:
    driver: local
